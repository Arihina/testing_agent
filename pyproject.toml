[project]
name = "tester-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alena Kozlova", email = "alena.kozlova2004@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
tester-agent = "tester_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=tests/fixtures"

[tool.ruff]
exclude = ["tests/fixtures"]
